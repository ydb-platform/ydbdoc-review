[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ydbdoc-review"
version = "0.2.0.dev0"
description = "Source-preserving translation, verification and continuation for YDB documentation"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0.0",
    "Pygments>=2.18.0",
    "mdit-py-plugins>=0.4.0",
    "PyYAML>=6.0.1",
    "requests>=2.32.0",
    "ydb[yc]>=3.0.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.5.0",
]

[project.scripts]
ydbdoc-review = "ydbdoc_review.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ydbdoc_review.prompts" = ["v1/translate_document.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --timeout=120 --timeout-method=signal --disable-socket --allow-unix-socket"
timeout_method = "signal"
markers = [
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
