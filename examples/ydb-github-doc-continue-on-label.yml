name: doc_continue
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  document:
    if: github.event.label.name == 'doc_continue'
    runs-on: ubuntu-latest
    steps:
      # Read the trusted base config; never execute the contributor checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ydb-platform/ydbdoc-review@main
        with:
          mode: doc_continue
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          config: ${{ github.workspace }}/.github/ydbdoc-models.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
          YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE: ${{ vars.YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE }}
          YDBDOC_MAX_SOURCE_CHARACTERS: ${{ vars.YDBDOC_MAX_SOURCE_CHARACTERS }}
          YDBDOC_ALLOWED_ACTORS: ${{ vars.YDBDOC_ALLOWED_ACTORS }}
          YDBDOC_DAILY_BUDGET_RUB: ${{ vars.YDBDOC_DAILY_BUDGET_RUB }}
