summary: >
  Amendment llm-wiring-v002 resolves all three v001 specification findings.
  TranslationChatOnce now has exact translation-owned protocol shape and strict
  one-provider-request semantics, and the amendment explicitly forbids creating
  or emulating it in this task. The current checkout does not expose chat_once,
  so implementation must report the declared prerequisite blocker rather than
  edit the shared client. The dedicated translation_model_policy namespace,
  exact six scalar keys, sole loader, fail-closed validation, and prohibition on
  shared ModelChoice chains remove configuration choice. The exhaustive outcome
  table now defines transient retry, model-unavailable advance, permanent block,
  protocol-invalid advance, first-valid acceptance, and exhaustion. Approval is
  of the amendment policy only and does not authorize implementation.
findings: []
resolved_findings:
  - id: "LLM-WIRING-V001-001"
    resolution: >
      ydbdoc_review.translation.model_policy owns the exact TranslationChatOnce
      Protocol signature. One call is exactly one provider request with no
      retry, fallback, chain lookup, or config reread. The amendment forbids
      shared-client edits, private-call wrapping, shared-chat emulation, and SDK
      duplication; absence of the prerequisite is a terminal task blocker.
  - id: "LLM-WIRING-V001-002"
    resolution: >
      The sole serialized namespace is translation_model_policy with exact
      translate/critic/repair primary and fallback scalar keys. The named
      translation-owned loader accepts no aliases, lists, inherited defaults,
      environment-only overrides, legacy chains, unknown keys, or missing and
      invalid values, and freezes the result in the manifest before reads/calls.
  - id: "LLM-WIRING-V001-003"
    resolution: >
      The exhaustive table now distinguishes registered transient retry,
      model-unavailable immediate fallback/exhaustion, permanent auth/config
      immediate block, protocol-invalid immediate fallback/exhaustion, first
      valid acceptance, and fail-closed unknown errors, with four requests max.
