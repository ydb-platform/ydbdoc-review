resolved_findings:
  - id: "ONE-PASS-003"
    resolution: >
      Parser-recognized direct YFM .md includes now resolve with the Markdown
      link rules and share the same BFS, seen_ru_paths set, recursive admission,
      duplicate handling, and job-wide 20-file budget. Includes have no ambient
      graph walk or separate budget, and boundary/alias cases are tested.
  - id: "ONE-PASS-004"
    resolution: >
      The mandatory-removal and migration sections explicitly delete the three
      named render-time translation helpers, all named fragment/structural EN
      repair writers, translation transport retries, model-chain iteration,
      cross-model fallback, and translation fallback configuration. Static and
      call-graph tests prove absence from translate and verify production paths.
  - id: "ONE-PASS-005"
    resolution: >
      The transaction contract now states that the structured warning report is
      the only inspectable artifact for failed or unresolved jobs. Staged EN is
      never uploaded, attached to a PR, committed, pushed, or otherwise
      published, and the required tests cover each prohibited publication path.
