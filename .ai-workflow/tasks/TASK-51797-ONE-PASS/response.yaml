summary: >
  Version one-pass-v003 is functionally complete. Direct YFM Markdown includes
  and Markdown links now use the same canonical seen set, breadth-first queue,
  recursive scanning, deterministic ordering, and single 20-file auto-added
  budget. The removal scope explicitly names all render-time fence/text/Cyrillic
  LLM writers, EN-mutating fragment and structural repair writers, and every
  translation-role retry, model-chain, cross-model fallback, and fallback-config
  path, with static-search and call-graph tests. Failed or unresolved jobs expose
  only the structured warning report; staged EN cannot be uploaded, attached,
  committed, pushed, or otherwise published. The prior v002 invariants remain
  explicit, including the universal RU queue and the single immutable
  source_tree_sha used for RU reads and EN existence.
