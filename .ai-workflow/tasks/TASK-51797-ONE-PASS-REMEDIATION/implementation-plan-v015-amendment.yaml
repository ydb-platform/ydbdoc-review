protocol_version: 1
task_id: TASK-51797-ONE-PASS-REMEDIATION
plan_version: one-pass-remediation-v015
amends: one-pass-remediation-v014
scope: R-004-final-manifest-lifecycle-only
resolver:
  input_plan_version: one-pass-remediation-v015
  required_predecessor_file: implementation-plan-v014-amendment.yaml
  required_predecessor_version: one-pass-remediation-v014
  operation: resolve_predecessor_then_append_exact_v015_self_sealing_paths
manifest_lifecycle:
  snapshot:
    capture_count: exactly_once
    mutation_or_recapture: forbidden
    verify_before_generation: [sha256, base_commit, entry_count, unique_paths, status_counts]
  bootstrap_manifest:
    output_absent: required
    output_present: RED
    behavior: existing_creation_only_unchanged
  refresh_manifest:
    output_present: required
    output_absent: RED_use_bootstrap_manifest
    input: complete_current_delta_plus_exact_manifest_output_path
    amendment: implementation-plan-v015-amendment.yaml
    mapping: all_paths_must_pass_resolved_fail_closed_classification
    generation: build_complete_replacement_in_memory
    prewrite_validation: full_schema_mapping_state_self_hash_and_path_equality
    write:
      method: sibling_temporary_file_fsync_atomic_replace
      target: .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
      error_behavior: leave_previous_target_bytes_unchanged
    postwrite_validation: required
    idempotency: second_refresh_without_other_delta_change_is_byte_identical
  quiescent_checkpoint:
    before_refresh: all_currently_approved_code_tests_reports_and_protocol_artifacts_materialized
    after_refresh: run_exact_validate_before_any_other_write
    later_delta_change: manifest_stale_and_refresh_plus_validate_required
refresh_command: >-
  .venv/bin/python -m scripts.remediation_policy_gate refresh-manifest
  --plan .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan.yaml
  --amendment .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan-v015-amendment.yaml
  --snapshot .ai-workflow/tasks/TASK-51797-ONE-PASS/baseline-snapshot-remediation-v005.yaml
  --base 9ff8edec9a26d3975306e20adca325c6eb9f77e6
  --output .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
validation_command: >-
  .venv/bin/python -m scripts.remediation_policy_gate validate
  --plan .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan.yaml
  --amendment .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan-v015-amendment.yaml
  --snapshot .ai-workflow/tasks/TASK-51797-ONE-PASS/baseline-snapshot-remediation-v005.yaml
  --manifest .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
  --base 9ff8edec9a26d3975306e20adca325c6eb9f77e6
post_capture_control_paths_addition:
  ownership_class: control_artifact
  requirement_ids: [workflow-protocol-provenance]
  baseline_state: {kind: absent, sha256: ""}
  exact_paths:
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/specification-v015-amendment.md
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan-v015-amendment.yaml
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/review-request-v015.md
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/response-v015.yaml
allowed_code_changes:
  - path: scripts/remediation_policy_gate.py
    symbols:
      - _resolved_amendment
      - build_manifest_document
      - refresh_manifest
      - _atomic_write_manifest
      - main
    operation: add_exact_v015_resolution_and_atomic_deterministic_refresh_command
  - path: tests/unit/test_remediation_policy_gate.py
    symbols: [manifest_refresh_tests, amendment_resolution_tests]
    operation: cover_full_lifecycle_failure_atomicity_idempotency_and_self_seal
required_tests:
  - bootstrap_still_refuses_existing_manifest
  - refresh_requires_existing_manifest
  - refresh_covers_exact_complete_current_delta
  - unclassified_or_forbidden_path_blocks_refresh_without_target_change
  - snapshot_verification_failure_blocks_refresh_without_target_change
  - temporary_write_failure_leaves_target_byte_identical
  - successful_refresh_then_validate_GREEN
  - second_refresh_without_delta_change_byte_identical
  - any_post_refresh_delta_change_makes_validate_RED
  - refresh_never_changes_snapshot_bytes
  - v015_requires_v014_predecessor
  - exact_four_v015_protocol_paths_self_sealed
unchanged:
  - manifest_schema_field_order_and_normalized_self_hash
  - every_resolved_v014_mapping
  - snapshot_immutability_and_v008_contract
  - required_absent_uv_lock
  - all_product_requirements
forbidden:
  - hand_authored_manifest_entry
  - snapshot_recapture_or_rewrite
  - best_effort_or_partial_manifest
  - silent_path_omission
  - generic_protocol_trust
  - non_atomic_target_overwrite
  - overwrite_via_bootstrap_manifest
  - unrelated_change
