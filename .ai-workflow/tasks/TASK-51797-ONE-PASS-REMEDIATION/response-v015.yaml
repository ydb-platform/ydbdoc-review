pre-validates, then writes via sibling temp + fsync + atomic replace of only the
exact configured manifest path, leaving prior bytes on any error. Idempotency
via normalized self-hash is required. Unclassified, wildcard-only, forbidden
deletion or unexpected protocol paths RED-block refresh without silent omission
or generic protocol trust.

Quiescent timing is exact: refresh only after all currently approved code,
tests, reports and reviewed protocol artifacts are materialized; validate
immediately after; later delta changes require refresh+validate again. Self-seal
of the four v015 protocol paths plus the stated sequence (materialize response,
implement refresh, refresh once, validate) stops this amendment from
invalidating its own final manifest without inventing future-path trust.
Predecessor must be exact `one-pass-remediation-v014`. No developer choice
