protocol_version: 1
task_id: TASK-51797-ONE-PASS-REMEDIATION
plan_version: one-pass-remediation-v006
amends: one-pass-remediation-v005
scope: R-004-manifest-bootstrap-only
authoritative_inputs:
  plan: .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan.yaml
  snapshot: .ai-workflow/tasks/TASK-51797-ONE-PASS/baseline-snapshot-remediation-v005.yaml
  base_commit: 9ff8edec9a26d3975306e20adca325c6eb9f77e6
  snapshot_entry_count: 114
output:
  manifest: .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
  overwrite: forbidden
allowed_code_changes:
  - path: scripts/remediation_policy_gate.py
    symbols: [bootstrap_manifest, classify_manifest_entry, normalized_manifest_self_sha256, main]
  - path: tests/unit/test_remediation_policy_gate.py
    symbols: [manifest_bootstrap_tests]
post_capture_control_paths:
  requirement_ids: [workflow-protocol-provenance]
  ownership_class: control_artifact
  exact_paths:
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/questions/R-004-manifest-bootstrap.md
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/specification-v006-amendment.md
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan-v006-amendment.yaml
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/review-request-v006.md
    - .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/response-v006.yaml
manifest_self_entry:
  path: .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
  ownership_class: implementation_report
  requirement_ids: [R-004]
  baseline_state: {kind: absent, sha256: ""}
  final_state_kind: present
  final_state_sha256: normalized_self_sha256
  normalization:
    serializer: "yaml.safe_dump(sort_keys=False, allow_unicode=True)"
    encoding: utf-8
    operation: set_only_self_entry_final_state_sha256_to_empty_string_then_hash_complete_serialization
    algorithm: sha256
manifest_top_level:
  exact_field_order: [protocol_version, task_id, plan_version, base_commit, entries]
  values:
    protocol_version: 1
    task_id: TASK-51797-ONE-PASS-REMEDIATION
    plan_version: one-pass-remediation-v006
    base_commit: 9ff8edec9a26d3975306e20adca325c6eb9f77e6
  entries_order: path_ascending_bytewise
entry_schema:
  exact_field_order: [path, git_status, ownership_class, baseline_state, final_state, requirement_ids, mapping_source]
  state_exact_field_order: [kind, sha256]
  allowed_ownership_classes: [production, test, configuration, script, implementation_report, control_artifact]
  requirement_ids_order: lexical_unique
  mapping_source: one_exact_source_identifier_or_lexically_ordered_item_requirement_identifiers
mapping_algorithm:
  input_paths: current_enumerate_delta_plus_manifest_output_path
  path_uniqueness: exact_once
  baseline_state:
    snapshot_path: copy_snapshot_state_byte_for_byte
    declared_post_capture_or_manifest_path: {kind: absent, sha256: ""}
    otherwise: RED
  final_state:
    ordinary_path: current_enumerate_delta_state
    manifest_path: normalized_self_sha256_rule
  git_status:
    ordinary_path: current_enumerate_delta_git_status
    manifest_path: "??"
  classification_precedence:
    - id: manifest-self
      match: output.manifest
      ownership_class: implementation_report
      requirement_ids: [R-004]
    - id: post-capture-control
      match: post_capture_control_paths.exact_paths
      ownership_class: control_artifact
      requirement_ids: [workflow-protocol-provenance]
    - id: v005-control
      match: baseline_contract_inventory.immutable_control_artifacts.exact_paths_or_planned_analyst_publication_before_capture.exact_paths
      ownership_class: control_artifact
      requirement_ids: copy_matching_inventory_requirement_ids_or_workflow-protocol-provenance
    - id: implementation-report
      match: implementation_manifest.control_artifact_rules.mutable_paths_excluding_snapshot_and_manifest
      ownership_class: implementation_report
      requirement_ids: [R-004]
    - id: baseline-inventory
      match: exactly_one_baseline_contract_inventory_group_other_than_control_groups_or_required_absent
      ownership_class_by_group:
        frozen_modified_production: production
        approved_deleted_production: production
        frozen_modified_tests: test
        approved_deleted_tests_and_fixtures: test
      requirement_ids: copy_group_requirement_ids
    - id: item-allowlist
      match: one_or_more_items_allowed_files_patterns
      ownership_class_by_path:
        "tests/**": test
        "scripts/**": script
        "src/ydbdoc_review/config/**": configuration
        "src/**": production
        ".ai-workflow/**": implementation_report
      requirement_ids: lexical_unique_union_of_all_matching_item_requirement_ids
  ambiguity:
    no_match: RED
    ownership_conflict: RED
    conflicting_non_item_mapping_sources: RED
    developer_resolution: forbidden
required_absent:
  path: uv.lock
  snapshot_fact: present_untracked
  current_and_final_required_state: absent
  manifest_entry: forbidden_because_not_in_current_delta
  check_points: [before_tests, after_tests, before_bootstrap, after_bootstrap, after_validation]
tool_policy:
  forbidden_commands: [uv, uv-lock, uv-sync, uv-run]
  approved_test_command: .venv/bin/python -m pytest tests/unit/test_remediation_policy_gate.py
  approved_python_prefix: .venv/bin/python
  approved_pytest_prefix: .venv/bin/pytest
  approved_ruff_prefix: .venv/bin/ruff
  missing_environment_action: write_question_and_stop_R-004
bootstrap_command: >-
  .venv/bin/python -m scripts.remediation_policy_gate bootstrap-manifest
  --plan .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan.yaml
  --amendment .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan-v006-amendment.yaml
  --snapshot .ai-workflow/tasks/TASK-51797-ONE-PASS/baseline-snapshot-remediation-v005.yaml
  --base 9ff8edec9a26d3975306e20adca325c6eb9f77e6
  --output .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
validation_command: >-
  .venv/bin/python -m scripts.remediation_policy_gate validate
  --plan .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan.yaml
  --amendment .ai-workflow/tasks/TASK-51797-ONE-PASS-REMEDIATION/implementation-plan-v006-amendment.yaml
  --snapshot .ai-workflow/tasks/TASK-51797-ONE-PASS/baseline-snapshot-remediation-v005.yaml
  --manifest .ai-workflow/tasks/TASK-51797-ONE-PASS/implementation-manifest-remediation-v003.yaml
  --base 9ff8edec9a26d3975306e20adca325c6eb9f77e6
required_tests:
  - exact_114_snapshot_entries_are_read_without_mutation
  - removed_uv_lock_is_not_emitted_and_is_required_absent
  - post_capture_control_paths_are_mapped_without_developer_choice
  - output_manifest_path_is_included_exactly_once
  - normalized_self_hash_is_stable_and_tamper_detecting
  - overwrite_is_refused
  - unmapped_path_is_RED
  - ownership_conflict_is_RED
  - requirement_ids_are_deterministic
  - final_manifest_paths_exactly_equal_current_delta
forbidden:
  - hand_authored_manifest_entry
  - developer_selected_mapping
  - default_mapping
  - silent_path_omission
  - snapshot_overwrite
  - literal_manifest_self_hash
  - iterative_self_hash_search
  - uv_command
  - regenerated_dependency_lock
