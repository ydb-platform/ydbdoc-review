ruff_corrections:
  path: src/ydbdoc_review/pipeline/navigation_merge.py
  symbol: _toc_translate_scope
  exact_replacements:
    - {old: 'RU base→PR diff', new: 'RU base-to-PR diff', finding: RUF002}
    - {old: 'every RU−EN missing href', new: 'every RU-EN missing href', finding: RUF002}
    - {old: 'every RU−EN missing', new: 'every RU-EN missing', finding: RUF003, context: comment_after_scope}
  operation: replace_only_ambiguous_unicode_in_existing_docstring_and_comment
  required_tests:
    - Ruff_exact_file_has_none_of_three_findings
    - approved_repository_wide_Ruff_contract_GREEN
    - runtime_diff_for_symbol_is_empty_except_three_prose_replacements
  forbidden: [noqa, Ruff_config_change, waiver, formatting, refactor, runtime_change, other_character_replacement]
allowed_support_changes:
  - path: scripts/remediation_policy_gate.py
    symbols: [_resolved_amendment, validate_deletions]
    operation: resolve_exact_v019_two_path_deletion_extension
  - path: tests/unit/test_remediation_policy_gate.py
    symbols: [amendment_resolution_tests, exact_deletion_tests]
    operation: prove_two_exact_deletions_pass_and_any_third_clean_at_capture_deletion_fails
