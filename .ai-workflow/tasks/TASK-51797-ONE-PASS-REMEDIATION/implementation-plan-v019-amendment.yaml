  required_predecessor_version: one-pass-remediation-v018
  operation: resolve_predecessor_then_append_exact_v019_rules_and_self_seal
exact_deletion_extension:
  requirement_ids: [R-021, FINAL-009]
  required_baseline_state: clean_at_capture_and_present_in_base
  required_final_state: deleted
  exact_paths:
    - src/ydbdoc_review/pipeline/skip_paths.py
    - tests/unit/test_translate_skip_paths.py
  gate_behavior:
    authorize_only_exact_paths: true
    preserve_rejection_for_every_other_undeclared_deletion: true
    no_snapshot_rewrite: true
