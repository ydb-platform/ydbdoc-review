name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [unit-parser, quality-links, translate, verify, continue, store-reports, cli, scale]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @diplodoc/cli@5.61.0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Offline tests (all collected cases assigned exactly once)
        run: timeout 900s uv run --locked python -m pytest -vv --ci-group '${{ matrix.group }}' --ci-inventory inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-${{ matrix.group }}
          path: inventory.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv build --no-sources
      - run: uv pip check
      - run: uv export --locked --no-dev --no-emit-project --no-hashes --no-header --no-annotate > expected.txt && diff -u requirements.txt expected.txt
