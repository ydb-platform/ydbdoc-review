name: ydbdoc-review
description: Translate, verify or continue YDB documentation in one pipeline
inputs:
  repo:
    description: GitHub repository owner/name
    required: true
  pr:
    description: Pull request number
    required: true
  mode:
    description: doc_translate, doc_verify or doc_continue
    required: true
  config:
    description: Absolute path to trusted technical model JSON within github.workspace
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/action-docker.sh"
      env:
        YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE: ${{ vars.YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE }}
        YDBDOC_MAX_SOURCE_CHARACTERS: ${{ vars.YDBDOC_MAX_SOURCE_CHARACTERS }}
        YDBDOC_ALLOWED_ACTORS: ${{ vars.YDBDOC_ALLOWED_ACTORS }}
        YDBDOC_DAILY_BUDGET_RUB: ${{ vars.YDBDOC_DAILY_BUDGET_RUB }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIG: ${{ inputs.config }}
