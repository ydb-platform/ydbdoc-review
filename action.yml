name: ydbdoc-review
description: Translate, verify or continue YDB documentation in one pipeline
inputs:
  repo:
    description: GitHub repository owner/name
    required: true
  pr:
    description: Pull request number
    required: true
  mode:
    description: run (doc_translate), verify (doc_verify), or continue (doc_continue)
    default: run
  config:
    description: Optional absolute path to trusted technical model JSON within github.workspace
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/action-docker.sh"
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIG: ${{ inputs.config }}
